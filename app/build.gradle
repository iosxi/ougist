plugins {
    id "com.android.application"
}

android {
    namespace "io.ougist"
    compileSdk 36

    defaultConfig {
        applicationId "io.ougist"
        minSdk 28
        targetSdk 36
        versionCode 2
        versionName "1.1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

// 外部ライブラリは使わない (AndroidX も無し)。
dependencies {
}
